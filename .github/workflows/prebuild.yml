name: Prebuild Dict
on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间 10:00 自动运行
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许修改仓库文件
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate words with AI
        run: node scripts/prebuild.mjs
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }} # 关联刚刚设置的密钥
      - name: Commit and Push
        run: |
          git config user.name  "dict-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dict/ index.json
          git diff --cached --quiet || git commit -m "chore: prebuild dict"
          git push
